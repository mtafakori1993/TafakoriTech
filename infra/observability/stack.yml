version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# TafakoriTech Observability Stack
# Deploy:  docker stack deploy -c stack.yml observability
# Prereqs: docker secret create elastic_password -
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Elasticsearch (single-node, clustering-ready) ─────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.4
    environment:
      # Cluster identity
      cluster.name: tafakoritech-logs
      node.name: "{{.Node.Hostname}}"
      # Single-node bootstrap; remove and set cluster.initial_master_nodes for multi-node
      discovery.type: single-node
      # JVM heap — set to half of container memory reservation
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      # Secret file mounted with mode 0400 (owner-read-only) so ES accepts it
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"       # TLS terminates at Kong/LB
      xpack.security.transport.ssl.enabled: "false"
      # Performance
      bootstrap.memory_lock: "true"
      indices.memory.index_buffer_size: "20%"
      # Allow auto-creation of system indices only
      action.auto_create_index: ".monitoring*,.watches,.triggered_watches,.watcher-history*,.ml*,tafakoritech*"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    secrets:
      - source: elastic_password_v2
        target: elastic_password
        uid: "1000"
        gid: "0"
        mode: 0400
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - obs-net
    healthcheck:
      # Root bypasses mode 0400 restriction, so cat works from the healthcheck process
      test:
        - CMD-SHELL
        - |
          curl -sf -u "elastic:$$(cat /run/secrets/elastic_password)" \
            "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" \
          | grep -qvE '"status":"red"'
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 5
        window: 180s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 120s

  # ── Kibana ────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.13.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # ES 8.x forbids the elastic superuser for Kibana; kibana_system is the right account.
      # setup.sh resets kibana_system password to KIBANA_SYSTEM_PASSWORD after ES starts.
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      SERVER_NAME: tafakoritech-kibana
      SERVER_HOST: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
      LOGGING_ROOT_LEVEL: warn
      xpack.fleet.enabled: "false"
    ports:
      - "9908:5601"
    networks:
      - obs-net
    depends_on:
      - elasticsearch
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://127.0.0.1:5601/api/status | grep -q '"level":"available"'
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 5
        window: 180s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s

  # ── Fluent Bit — global (one per Swarm node) ─────────────────────────────
  fluent-bit:
    image: fluent/fluent-bit:3.0
    environment:
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      # Dedicated write-only ES user (created by setup.sh); avoids using elastic superuser
      ES_USER: ${FLUENT_BIT_ES_USER:-fluent_bit}
      ES_PASSWORD: ${FLUENT_BIT_ES_PASSWORD}
      # HOSTNAME and NODE_ID are injected by the Swarm scheduler
      HOSTNAME: "{{.Node.Hostname}}"
      NODE_ID: "{{.Node.ID}}"
    volumes:
      # Docker container log files (read-only)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Host system logs
      - /var/log:/var/log:ro
      # Fluent Bit position database (survives restarts)
      - fluent-bit-db:/data/fluent-bit
    configs:
      - source: fluent-bit-config
        target: /fluent-bit/etc/fluent-bit.conf
        mode: 0444
      - source: fluent-bit-parsers-v2
        target: /fluent-bit/etc/parsers.conf
        mode: 0444
      - source: fluent-bit-lua
        target: /fluent-bit/etc/extract_meta.lua
        mode: 0444
    networks:
      - obs-net
    depends_on:
      - elasticsearch
    deploy:
      mode: global
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 60s
      update_config:
        parallelism: 1
        order: stop-first

networks:
  obs-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  es-data:
    driver: local
  fluent-bit-db:
    driver: local

secrets:
  elastic_password_v2:
    external: true

configs:
  fluent-bit-config:
    file: ./fluent-bit/fluent-bit.conf
  fluent-bit-parsers-v2:
    file: ./fluent-bit/parsers.conf
  fluent-bit-lua:
    file: ./fluent-bit/extract_meta.lua
