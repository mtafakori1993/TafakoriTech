[PARSER]
    # Outer Docker JSON log wrapper:
    # {"log":"...\n","stream":"stdout","time":"2026-06-13T12:00:00.000000000Z"}
    Name         docker
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%L
    Time_Keep    On

[PARSER]
    # Inner Zap JSON emitted by microservices
    Name         zap_json
    Format       json
    Time_Key     timestamp
    Time_Format  %Y-%m-%dT%H:%M:%SZ
    Time_Keep    On

[PARSER]
    # Generic JSON fallback (non-Zap services, Kong access logs, etc.)
    Name         generic_json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%SZ
    Time_Keep    On
