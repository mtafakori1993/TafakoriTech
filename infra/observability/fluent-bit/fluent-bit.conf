# ─────────────────────────────────────────────────────────────────────────────
# Fluent Bit configuration for TafakoriTech
# Collects Docker container logs from all Swarm nodes → Elasticsearch
# ─────────────────────────────────────────────────────────────────────────────

[SERVICE]
    Flush             5
    Daemon            Off
    Log_Level         warn
    Parsers_File      /fluent-bit/etc/parsers.conf
    # Built-in HTTP health/metrics endpoint
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    # Storage — filesystem-backed to survive brief ES outages
    storage.type      filesystem
    storage.path      /data/fluent-bit/storage
    storage.sync      normal
    storage.checksum  Off
    storage.max_chunks_up 128

# ─── INPUT ───────────────────────────────────────────────────────────────────

[INPUT]
    Name              tail
    Tag               docker.<container_id>
    Tag_Regex         (?<container_id>[a-f0-9]{64})
    Path              /var/lib/docker/containers/*/*-json.log
    # Uses the docker parser to strip the outer log wrapper
    Parser            docker
    # SQLite DB to track file offsets — survives restarts
    DB                /data/fluent-bit/docker.db
    DB.sync           Normal
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    # Ignore log files older than 24 h (avoids re-processing on restart)
    Ignore_Older      24h
    storage.type      filesystem

# ─── FILTERS ─────────────────────────────────────────────────────────────────

# 1. Parse the inner Zap JSON from the `log` field produced by the docker parser.
#    After this filter, all Zap fields (service, level, trace_id, …) are merged
#    into the top-level record and the raw `log` string is removed.
[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            zap_json
    Reserve_Data      On
    Preserve_Key      Off

# 2. Enrich every record with the node hostname and Swarm node ID.
#    HOSTNAME and NODE_ID are injected into the container environment by the
#    Docker Swarm scheduler via {{.Node.Hostname}} / {{.Node.ID}} in the
#    stack.yml service spec.
[FILTER]
    Name              record_modifier
    Match             docker.*
    Record            swarm_hostname ${HOSTNAME}
    Record            swarm_node_id  ${NODE_ID}

# 3. Lift the `container_id` captured from the tag into the record so it's
#    searchable in Kibana.
[FILTER]
    Name              lua
    Match             docker.*
    script            /fluent-bit/etc/extract_meta.lua
    call              extract_meta

# 4. Drop Fluent Bit's own log lines to avoid infinite loops.
[FILTER]
    Name              grep
    Match             docker.*
    Exclude           $swarm_hostname ^$
    # Exclude any record whose `service` field is "fluent-bit"
    Exclude           service fluent-bit

# 5. Redact sensitive fields before shipping.
#    These fields must never appear in Elasticsearch.
[FILTER]
    Name              modify
    Match             docker.*
    Remove            password
    Remove            token
    Remove            secret
    Remove            api_key
    Remove            authorization
    Remove            x-api-key

# ─── OUTPUT ───────────────────────────────────────────────────────────────────

[OUTPUT]
    Name                  es
    Match                 docker.*
    Host                  ${ES_HOST}
    Port                  ${ES_PORT}
    HTTP_User             ${ES_USER}
    HTTP_Passwd           ${ES_PASSWORD}
    # Daily index: tafakoritech-logs-YYYY.MM.DD
    Logstash_Format       On
    Logstash_Prefix       tafakoritech-logs
    Logstash_DateFormat   %Y.%m.%d
    # Write @timestamp from the parsed log time (not ingest time)
    Time_Key              @timestamp
    Time_Key_Format       %Y-%m-%dT%H:%M:%S
    # Elasticsearch 8.x: types are removed
    Suppress_Type_Name    On
    # Replace dots in field names (ES rejects dotted keys as sub-objects)
    Replace_Dots          On
    # Retry on transient failures
    Retry_Limit           5
    # Buffer size for bulk API calls
    Buffer_Size           5MB
    # Generate a deterministic _id to allow safe retries (idempotent)
    Generate_ID           On
    tls                   Off
    tls.verify            Off
    # Trace ES errors in the Fluent Bit log
    Trace_Error           On
    storage.total_limit_size 1GB
