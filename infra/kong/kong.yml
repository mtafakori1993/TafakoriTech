_format_version: "3.0"
_transform: true

consumers:
  - username: api-client
    jwt_secrets:
      - key: tafakori-auth
        secret: ${JWT_SECRET}

plugins:
  - name: pre-function
    config:
      access:
        - |
          local auth = kong.request.get_header("Authorization")
          if auth and not auth:lower():match("^bearer ") then
            kong.service.request.set_header("Authorization", "Bearer " .. auth)
          end

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-API-Key
        - X-Admin-Key
        - X-Request-ID
        - X-Captcha-Token
        - X-Trace-ID
      exposed_headers:
        - Authorization
        - X-Request-ID
      credentials: false
      max_age: 3600

services:

  # ── Sentinel (Authentication — public, no JWT required) ───────────────────
  - name: sentinel-docs
    url: http://sentinel:9501/openapi.json
    routes:
      - name: sentinel-openapi
        paths:
          - /sentinel/openapi.json
        strip_path: true
        methods: [GET]

  - name: sentinel
    url: http://sentinel:9501
    routes:
      - name: sentinel-route
        paths:
          - /sentinel
        strip_path: true
        preserve_host: false

  # ── Persona (IAM) ─────────────────────────────────────────────────────────
  - name: persona-docs
    url: http://persona:9502/openapi.json
    routes:
      - name: persona-openapi
        paths:
          - /persona/openapi.json
        strip_path: true
        methods: [GET]

  - name: persona-health
    url: http://persona:9502/health
    routes:
      - name: persona-health-route
        paths:
          - /persona/health
        strip_path: true
        methods: [GET]

  - name: persona
    url: http://persona:9502
    routes:
      - name: persona-route
        paths:
          - /persona
        strip_path: true
        preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp

  # ── Marshal (Project Manager) ─────────────────────────────────────────────
  - name: marshal-docs
    url: http://marshal:9504/openapi.json
    routes:
      - name: marshal-openapi
        paths:
          - /marshal/openapi.json
        strip_path: true
        methods: [GET]

  - name: marshal
    url: http://marshal:9504
    routes:
      - name: marshal-route
        paths:
          - /marshal
        strip_path: true
        preserve_host: false
    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - "X-API-Key:Bearer ${MARSHAL_API_KEY}"

  # ── Herald (Headless CMS) ─────────────────────────────────────────────────
  - name: herald-docs
    url: http://herald:9503/openapi.json
    routes:
      - name: herald-openapi
        paths:
          - /herald/openapi.json
        strip_path: true
        methods: [GET]

  - name: herald
    url: http://herald:9503
    routes:
      - name: herald-route
        paths:
          - /herald
        strip_path: true
        preserve_host: false
    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - "X-API-Key:Bearer ${HERALD_API_KEY}"

  # ── Pulse (Notification Service) ─────────────────────────────────────────
  - name: pulse-docs
    url: http://pulse:9505/openapi.json
    routes:
      - name: pulse-openapi
        paths:
          - /pulse/openapi.json
        strip_path: true
        methods: [GET]

  - name: pulse
    url: http://pulse:9505
    routes:
      - name: pulse-route
        paths:
          - /pulse
        strip_path: true
        preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp

  # ── Swagger UI ─────────────────────────────────────────────────────────────
  - name: swagger-ui
    url: http://swagger-ui:8080
    routes:
      - name: swagger-ui-route
        paths:
          - /swagger
        strip_path: true
        preserve_host: false
